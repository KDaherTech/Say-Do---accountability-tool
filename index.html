<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say &amp; Do</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</head>
<body>
<div id="app">Loading…</div>
<script>
(function(){
  'use strict';

  var TZ = 'America/Los_Angeles';

  var CSS_TEXT = `
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F7F9FB; --text:#1E2430; --text-muted:#5B6472;
    --border:#DBE1E7; --accent-am:#C97F2E; --accent-pm:#6A5ACD;
    --accent-am-soft:#F3E3CD; --accent-pm-soft:#E4E1F8;
    --done:#3F9670; --done-soft:#DCEEE5; --danger:#B14A3E; --danger-soft:#F5DEDC; --ring:#8891A0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10141F; --surface:#171C2A; --surface-2:#1C2233; --text:#ECEEF3; --text-muted:#9AA3B2;
      --border:#2B3244; --accent-am:#E7A54B; --accent-pm:#9C90EA;
      --accent-am-soft:#3B2C16; --accent-pm-soft:#2A2650;
      --done:#57B58C; --done-soft:#163A2C; --danger:#DD8B7E; --danger-soft:#3B211E; --ring:#5B6472;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10141F; --surface:#171C2A; --surface-2:#1C2233; --text:#ECEEF3; --text-muted:#9AA3B2;
    --border:#2B3244; --accent-am:#E7A54B; --accent-pm:#9C90EA;
    --accent-am-soft:#3B2C16; --accent-pm-soft:#2A2650;
    --done:#57B58C; --done-soft:#163A2C; --danger:#DD8B7E; --danger-soft:#3B211E; --ring:#5B6472;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text); font-family:'Karla',system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:28px 20px 64px;}
  .eyebrow{
    font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:11px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-muted); margin:0 0 4px;
  }
  h1{
    font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:34px; margin:0 0 2px;
    text-wrap:balance; letter-spacing:-.01em;
  }
  .sub{color:var(--text-muted); font-size:14px; margin:0 0 22px;}
  .header-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .streak{
    font-family:'IBM Plex Mono',ui-monospace,monospace; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:8px 16px; font-size:13px; white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  .streak b{font-size:16px; margin-right:4px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:8px 4px;
    margin-bottom:24px;
  }
  .section-title{
    font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:16px; margin:14px 18px 8px;
  }
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(16,20,31,.45); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:20;
  }
  .confirm-box{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px;
    max-width:300px; width:100%; box-shadow:0 12px 32px rgba(0,0,0,.25);
  }
  .confirm-text{margin:0 0 16px; font-size:14.5px; line-height:1.5;}
  .confirm-actions{display:flex; gap:8px; justify-content:flex-end;}
  .confirm-actions button{
    font-family:'Karla',sans-serif; font-weight:700; font-size:13px; border-radius:9px; padding:8px 14px; cursor:pointer;
    border:1px solid var(--border);
  }
  .confirm-cancel{background:var(--surface-2); color:var(--text);}
  .confirm-remove{background:var(--danger); border-color:var(--danger); color:#fff;}
  .confirm-cancel:focus-visible, .confirm-remove:focus-visible{outline:2px solid var(--ring); outline-offset:2px;}
  .cell-group{display:flex; gap:6px;}
  .pill{
    font-family:'Karla',sans-serif; font-size:12px; font-weight:700; border-radius:999px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); padding:6px 10px; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px; transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .pill:focus-visible{outline:2px solid var(--ring); outline-offset:2px;}
  .pill.miss.on{background:var(--danger-soft); border-color:var(--danger); color:var(--danger);}
  .pill.pm.on{background:var(--done-soft); border-color:var(--done); color:var(--done);}
  .task-name{
    cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation;
    border-radius:6px; padding:2px 6px; margin:-2px -6px; transition:background .18s ease, color .18s ease;
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .task-name.pressing{background:var(--danger-soft); color:var(--danger);}
  .empty{padding:22px 18px; color:var(--text-muted); font-size:14px; line-height:1.6;}
  .add-form{padding:14px 14px 2px;}
  .add-field{margin-bottom:14px;}
  .add-label{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-muted); margin-bottom:7px;
  }
  .add-form > .add-field:first-child input{
    width:100%; font-family:'Karla',sans-serif; font-size:14px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); box-sizing:border-box;
  }
  .add-form > .add-field:first-child input:focus-visible{outline:2px solid var(--ring); outline-offset:1px;}
  .add-submit{
    width:100%; font-family:'Karla',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:10px;
    background:var(--text); color:var(--bg); padding:12px 16px; cursor:pointer; margin-bottom:6px;
  }
  .add-submit:disabled{opacity:.4; cursor:default;}
  .score-table{width:100%; border-collapse:collapse; margin:2px 4px 14px; font-family:'IBM Plex Mono',monospace;}
  .score-table th, .score-table td{padding:8px 14px; text-align:left; font-size:13px; font-variant-numeric:tabular-nums;}
  .score-table thead th{color:var(--text-muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border);}
  .score-table td:first-child{color:var(--text-muted); font-family:'Karla',sans-serif; font-size:13px;}
  .score-table tbody tr + tr td{border-top:1px solid var(--border);}
  .score-table td:not(:first-child), .score-table th:not(:first-child){text-align:right;}
  .panes{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:2px;}
  .pane{padding:4px 0;}
  .pane-header{
    display:flex; align-items:center; gap:8px; padding:8px 16px 10px;
  }
  .pane-header input{
    font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:17px; border:none; background:transparent;
    color:var(--text); width:100%; padding:2px 0;
  }
  .pane-header input:focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:4px;}
  .person-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .pane-subhead{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); padding:12px 16px 4px;
  }
  .task-row{
    display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:6px;
    padding:8px 16px; border-top:1px solid var(--border);
  }
  .pane-header + .task, .pane-header + .empty{border-top:none;}
  .task:first-child .task-row{border-top:none;}
  .task-name{font-weight:500; font-size:14px;}
  .pill.weekly{padding:6px 12px;}
  .pane .empty{padding:6px 16px 16px;}
  .drag-handle{
    cursor:grab; color:var(--text-muted); font-size:15px; padding:4px 2px; touch-action:none;
    user-select:none; -webkit-user-select:none; line-height:1;
  }
  .drag-handle:active{cursor:grabbing;}
  .sortable-ghost{opacity:.3;}
  .sortable-chosen .task-row{background:var(--surface-2); border-radius:10px;}
  .sortable-drag .task-row{box-shadow:0 8px 20px rgba(0,0,0,.18); border-radius:10px;}
  .note-toggle{
    background:none; border:none; font-size:13px; cursor:pointer; padding:4px 6px; border-radius:6px; opacity:.5;
    line-height:1;
  }
  .note-toggle:hover{opacity:1; background:var(--surface-2);}
  .note-toggle.has-note{opacity:1;}
  .note-toggle:focus-visible{outline:2px solid var(--ring);}
  .note-panel{padding:0 16px 10px 40px;}
  .note-panel[hidden]{display:none;}
  .note-banner{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); background:none; border:none; padding:4px 2px 6px; cursor:pointer;
  }
  .note-banner:hover{color:var(--text);}
  .note-banner:focus-visible{outline:2px solid var(--ring);}
  .note-banner .chev{font-size:10px;}
  .note-panel textarea{
    width:100%; min-height:52px; resize:vertical; font-family:'Karla',sans-serif; font-size:13px;
    padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    box-sizing:border-box;
  }
  .note-panel textarea:focus-visible{outline:2px solid var(--ring); outline-offset:1px;}
  .cadence-hint{font-size:11px; color:var(--text-muted); padding:0 14px 12px; margin-top:-6px;}
  .history{display:flex; gap:6px; overflow-x:auto; padding:4px 2px 8px;}
  .day-cell{
    flex:0 0 auto; width:38px; height:44px; border-radius:9px; border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    cursor:pointer; background:none; font-family:inherit; padding:0;
  }
  .day-cell:focus-visible{outline:2px solid var(--ring); outline-offset:2px;}
  .day-cell .dow{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--text-muted); text-transform:uppercase;}
  .day-cell .num{font-family:'IBM Plex Mono',monospace; font-size:12px; font-variant-numeric:tabular-nums;}
  .day-cell.today{border-color:var(--ring); border-width:2px;}
  .day-cell.viewing{border-color:var(--accent-am); border-width:2px; box-shadow:0 0 0 1px var(--accent-am);}
  .legend{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--text-muted); padding:0 4px 6px;}
  .legend-swatch{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:middle;}
  footer{
    display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:12px; margin-top:6px;
    font-family:'IBM Plex Mono',monospace; flex-wrap:wrap;
  }
  .status-dot{width:7px; height:7px; border-radius:50%; background:var(--text-muted);}
  .status-dot.ok{background:var(--done);}
  .status-dot.busy{background:var(--accent-am);}
  .status-dot.err{background:var(--danger);}
  .settings-link{background:none; border:none; color:var(--text-muted); font-family:inherit; font-size:12px; cursor:pointer; text-decoration:underline; padding:0;}
  .settings-link:hover{color:var(--text);}
  @media (prefers-reduced-motion: reduce){ .pill{transition:none;} }

  .back-link{
    background:none; border:none; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.06em; cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:5px;
    margin-bottom:14px;
  }
  .back-link:hover{color:var(--text);}

  .home-tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:24px;}
  .profile-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 20px;
    cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px; font-family:inherit;
    transition:border-color .15s ease, transform .1s ease; -webkit-tap-highlight-color:transparent;
  }
  .profile-tile:hover{border-color:var(--ring);}
  .profile-tile:active{transform:scale(.98);}
  .profile-tile:focus-visible{outline:2px solid var(--ring); outline-offset:2px;}
  .tile-dot{width:16px; height:16px; border-radius:50%;}
  .profile-tile h2{font-family:'Fraunces',Georgia,serif; font-size:23px; font-weight:600; margin:0;}
  .tile-meta{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em;
  }
  .tile-stat-row{display:flex; gap:14px; margin-top:2px;}
  .tile-stat b{font-size:15px; font-variant-numeric:tabular-nums;}

  .leader-row{
    display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--border);
    gap:10px;
  }
  .leader-row:first-child{border-top:none;}
  .leader-who{display:flex; align-items:center; gap:10px; min-width:0;}
  .leader-name{font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .leader-crown{font-size:14px;}
  .leader-pts{display:flex; gap:16px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); white-space:nowrap;}
  .leader-pts b{color:var(--text); font-size:14px; font-variant-numeric:tabular-nums;}

  .insight-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));}
  .insight-card{padding:14px 18px; border-top:1px solid var(--border);}
  .insight-grid .insight-card:nth-child(-n+2){border-top:none;}
  @media (min-width:480px){
    .insight-card:nth-child(2){border-left:1px solid var(--border);}
  }
  .insight-name{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; margin-bottom:10px;}
  .insight-stats{display:flex; gap:18px; flex-wrap:wrap;}
  .stat-num{font-family:'IBM Plex Mono',monospace; font-size:19px; font-variant-numeric:tabular-nums;}
  .stat-label{font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}

  .date-nav{display:flex; align-items:center; justify-content:center; gap:10px; padding:2px 0 6px;}
  .date-nav-btn{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px; width:34px; height:34px;
    font-size:15px; cursor:pointer; color:var(--text); display:flex; align-items:center; justify-content:center;
  }
  .date-nav-btn:disabled{opacity:.35; cursor:default;}
  .date-nav-btn:focus-visible{outline:2px solid var(--ring);}
  .date-label{
    font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-muted); min-width:150px; text-align:center;
  }
  .date-label b{color:var(--text); font-weight:700; display:block; font-size:13px; text-transform:none; letter-spacing:0; margin-top:1px;}
  .jump-today{
    background:none; border:none; color:var(--accent-am); font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; cursor:pointer; padding:0; text-decoration:underline;
  }

  .wizard-overlay{
    position:fixed; inset:0; background:rgba(16,20,31,.5); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:30;
  }
  .wizard-box{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 22px 20px;
    max-width:360px; width:100%; box-shadow:0 16px 40px rgba(0,0,0,.3); position:relative;
  }
  .wizard-close{
    position:absolute; top:14px; right:14px; background:none; border:none; color:var(--text-muted); font-size:15px;
    cursor:pointer; padding:6px; line-height:1; border-radius:6px;
  }
  .wizard-close:hover{color:var(--text); background:var(--surface-2);}
  .wizard-close:focus-visible{outline:2px solid var(--ring);}
  .wizard-progress{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-muted); margin-bottom:6px;
  }
  .wizard-goal-name{
    font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; margin:0 0 18px; text-wrap:balance; padding-right:22px;
  }
  .wizard-back{
    background:none; border:none; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; cursor:pointer; padding:0; margin-bottom:12px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .wizard-back:hover{color:var(--text);}
  .wizard-q{font-family:'Fraunces',Georgia,serif; font-size:16px; font-weight:600; margin:0 0 14px;}
  .wizard-options{display:grid; gap:8px; margin-bottom:6px;}
  .wizard-options-3{grid-template-columns:1fr 1fr 1fr;}
  .wizard-options-list{grid-template-columns:1fr;}
  .wizard-opt{
    font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px; border:1.5px solid var(--border);
    background:var(--surface-2); color:var(--text); border-radius:12px; padding:16px 10px; cursor:pointer;
    text-align:center; transition:border-color .12s ease, background .12s ease, color .12s ease;
  }
  .wizard-options-list .wizard-opt{text-align:left; padding:14px 16px;}
  .wizard-opt:hover{border-color:var(--ring);}
  .wizard-opt:active{background:var(--done-soft); border-color:var(--done); color:var(--done);}
  .wizard-opt:focus-visible{outline:2px solid var(--ring);}
  .wizard-points{display:flex; align-items:center; justify-content:center; gap:24px; padding:8px 0 24px;}
  .wizard-step-btn{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
    font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .wizard-step-btn:disabled{opacity:.3; cursor:default;}
  .wizard-step-btn:focus-visible{outline:2px solid var(--ring);}
  .wizard-points-val{
    font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:700; min-width:38px; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .wizard-submit{
    width:100%; font-family:'Karla',sans-serif; font-weight:700; font-size:14px; border:none; border-radius:10px;
    background:var(--text); color:var(--bg); padding:12px 16px; cursor:pointer;
  }
  .wizard-hint{font-size:11.5px; color:var(--text-muted); line-height:1.5; margin-top:2px;}
  .wizard-input{
    width:100%; font-family:'Karla',sans-serif; font-size:14px; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); box-sizing:border-box; margin-bottom:14px;
  }
  .wizard-input:focus-visible{outline:2px solid var(--ring); outline-offset:1px;}
  .wizard-summary{font-size:13.5px; line-height:1.6; color:var(--text-muted); margin:0 0 18px;}

  .tracker-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .tracker-row:first-child{border-top:none;}
  .tracker-info{min-width:0;}
  .tracker-name{font-weight:700; font-size:14px;}
  .tracker-meta{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-muted); margin-top:3px;}
  .tracker-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .tracker-btn{
    font-family:'Karla',sans-serif; font-weight:700; font-size:12px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); padding:7px 12px; cursor:pointer;
  }
  .tracker-btn:hover{border-color:var(--ring);}
  .tracker-btn:focus-visible{outline:2px solid var(--ring);}
  .tracker-btn.danger{color:var(--danger); border-color:var(--danger-soft);}
  .tracker-btn.danger:hover{background:var(--danger-soft);}

  .category-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .category-chip{
    font-family:'Karla',sans-serif; font-weight:700; font-size:11.5px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-muted); padding:6px 12px; cursor:pointer;
  }
  .category-chip:hover{border-color:var(--ring);}
  .category-chip.active{background:var(--done-soft); border-color:var(--done); color:var(--done);}
  .category-chip:focus-visible{outline:2px solid var(--ring);}

  .toggle-pill{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    font-family:'Karla',sans-serif; font-size:13px; border:1.5px solid var(--border); border-radius:10px;
    background:var(--surface-2); color:var(--text); padding:11px 14px; cursor:pointer; margin-bottom:16px; text-align:left;
  }
  .toggle-pill .switch{
    width:34px; height:20px; border-radius:999px; background:var(--border); position:relative; flex:0 0 auto; transition:background .15s ease;
  }
  .toggle-pill .switch::after{

  var CONFIG = null;

    if (!res.ok){ var err = new Error('http_' + res.status); err.status = res.status; throw err; }
    return await res.json();

    if (!res.ok){ var err = new Error('http_' + res.status); err.status = res.status; throw err; }
    return await res.json();
  }

      idle:'Ready', loading:'Loading…', syncing:'Checking for updates…', saving:'Saving…', saved:'Saved',

      }

    }

      {type:'cell', dateKey:dateKey, habitId:habitId, personKey:personKey, field:'done', value:cell.done});

      {type:'cell', dateKey:dateKey, habitId:habitId, personKey:personKey, field:'missed', value:cell.missed});

  function clampPoints(p){
    p = parseInt(p, 10);

  function addHabit(name, assignee, cadence, points){

    if (cadence && cadence !== 'daily') h.cadence = cadence;

  // Reordering: `visibleIds` is the new sequence of just the tiles that were
  // on screen in that drag list (weekend-only habits, say, are hidden on a
  // Tuesday and so never appear in the drag). We splice that new sequence
  // back into the full per-person order at the spot the first of those ids
  // used to occupy, so items hidden today keep their place instead of being
  // silently bumped to the end.
  function reorderGroup(personKey, group, visibleIds){
    var order = ensureOrder(STATE)[personKey];
    var existing = order[group] || [];
    var visibleSet = {};
    visibleIds.forEach(function(id){ visibleSet[id] = true; });
    var firstIdx = -1;
    for (var i = 0; i < existing.length; i++){
      if (visibleSet[existing[i]]){ firstIdx = i; break; }
    }
    var withoutVisible = existing.filter(function(id){ return !visibleSet[id]; });
    var insertAt = firstIdx === -1 ? withoutVisible.length : Math.min(firstIdx, withoutVisible.length);
    var result = withoutVisible.slice(0, insertAt).concat(visibleIds, withoutVisible.slice(insertAt));
    order[group] = result;
    queueOp('reorder|' + personKey + '|' + group, {type:'reorder', personKey:personKey, group:group, order:result});
    scheduleSave();
  }

  // Jump straight into "load this saved tracker", skipping the who/kind

  function startLoadFromLibrary(entryId){
    var entry = STATE.trackerLibrary.find(function(t){ return t.id === entryId; });
    if (!entry) return;
    trackerWizard = {screen:'confirm', scope:entry.scope, kind:'load', libraryEntryId:entryId, templateId:null, saveName:'', categoryFilter:'All', history:['kind']};
    if (habitsForScope(STATE, entry.scope).length > 0){

  // Jump into "apply this saved template", asking only who it's for — used
  // by the My Trackers management screen's Apply button on a template.
  function startApplyTemplate(templateId){
    var tpl = STATE.templates.find(function(t){ return t.id === templateId; });
    if (!tpl) return;
    trackerWizard = {screen:'who', scope:null, kind:'customTemplate', libraryEntryId:null, templateId:templateId, saveName:'', categoryFilter:'All', history:[]};
    render();

  function applyTrackerChange(scope, kind, opts){
    opts = opts || {};
    var current = habitsForScope(STATE, scope);
    if (current.length){
      var name = (opts.saveName || '').trim().slice(0, 40) || defaultTrackerName(scope);
      var savedEntry = {id: genId(), name: name, scope: scope, savedAt: todayKey(), habitIds: current.map(function(h){ return h.id; })};
      STATE.trackerLibrary.push(savedEntry);
      queueOp('addTracker|' + savedEntry.id, {type:'addTracker', entry: savedEntry});
      current.forEach(function(h){
        h.archived = true;
        queueOp('archive|' + h.id, {type:'archive', habitId: h.id});
      });
    }
    if (kind === 'hard75'){
      TEMPLATE_75HARD.forEach(function(item){
        var h = {id: genId(), name: item.name, assignee: scope, points: clampPoints(item.points), archived:false};
        STATE.habits.push(h);
        queueOp('add|' + h.id, {type:'add', habit:h});
      });
    } else if (kind === 'customTemplate'){
      var tpl = STATE.templates.find(function(t){ return t.id === opts.templateId; });
      if (tpl){
        tpl.items.forEach(function(item){
          var h = {id: genId(), name: item.name, assignee: scope, points: clampPoints(item.points || 1), archived:false};
          if (item.cadence && item.cadence !== 'daily') h.cadence = item.cadence;
          STATE.habits.push(h);
          queueOp('add|' + h.id, {type:'add', habit:h});
        });
      }
    } else if (kind === 'load'){
      var entry = STATE.trackerLibrary.find(function(t){ return t.id === opts.libraryEntryId; });
      if (entry){
        entry.habitIds.forEach(function(id){
          var h = STATE.habits.find(function(hh){ return hh.id === id; });
          if (h){
            h.archived = false;
            queueOp('unarchive|' + h.id, {type:'unarchive', habitId: h.id});
          }
        });
      }
    }
    // kind === 'custom': nothing further — the scope is now a clean slate,
    // ready for "Add a goal".
    render();
    scheduleSave();
  }

  // ==========================================================================
  // Save-as-template: capture a person's CURRENT goal definitions as a named,
  // categorized, reusable template — independent of the live habit ids, so it
  // survives edits/removals and can be applied again for either of you (or,
  // eventually, shared). Unlike the tracker library, this never archives
  // anything: it's a copy, not a move.
  // ==========================================================================
  function uniqueTemplateCategories(){
    var set = {};
    STATE.templates.forEach(function(t){ set[t.category] = true; });
    return Object.keys(set).sort();
  }

  function defaultTemplateName(scope){
    var p = personByKey(STATE, scope);
    return (p ? p.name + '’s' : 'My') + ' Routine';
  }

  function collectCurrentItems(scope){
    var list = habitsFor(dailyHabits(STATE), scope)
      .concat(habitsFor(weeklyHabits(STATE), scope))
      .concat(habitsFor(monthlyHabits(STATE), scope));
    return list.map(function(h){
      var item = {name: h.name, points: h.points || 1};
      if (h.cadence && h.cadence !== 'daily') item.cadence = h.cadence;
      return item;
    });
  }

  function openSaveTemplateModal(scope){
    if (!collectCurrentItems(scope).length) return;
    templateSaveModal = {scope: scope, name: defaultTemplateName(scope), category: '', isPublic: false};

    var category = (templateSaveModal.category || '').trim().slice(0, 30) || 'Custom';
    var tpl = {
      id: genId(), name: name, category: category, isPublic: !!templateSaveModal.isPublic,
      createdAt: todayKey(), createdByScope: scope, items: items

  function requestDeleteTracker(id){ confirmDeleteTrackerId = id; render(); }

  function confirmDeleteTracker(){
    var id = confirmDeleteTrackerId;
    confirmDeleteTrackerId = null;

    render();

  function deleteTrackerLibraryEntry(id){
    var entry = STATE.trackerLibrary.find(function(t){ return t.id === id; });
    if (!entry) return;
    var idsToRemove = entry.habitIds.filter(function(hid){
      var h = STATE.habits.find(function(hh){ return hh.id === hid; });
      return h && h.archived;
    });
    if (idsToRemove.length){
      var removeSet = {};
      idsToRemove.forEach(function(hid){ removeSet[hid] = true; });
      STATE.habits = STATE.habits.filter(function(h){ return !removeSet[h.id]; });
      idsToRemove.forEach(function(hid){ queueOp('remove|' + hid, {type:'remove', habitId:hid}); });
    }
    STATE.trackerLibrary = STATE.trackerLibrary.filter(function(t){ return t.id !== id; });
    queueOp('deleteTracker|' + id, {type:'deleteTracker', id:id});
    scheduleSave();
  }

      '<button type="button" class="date-nav-btn" data-nav-day="-1"' + (dKey <= earliestNavigableKey() ? ' disabled' : '') + ' title="Previous day">&larr;</button>' +
      '<div class="date-label">' + esc(fullDate(dKey)) + (isToday ? '' : '<b>Viewing a past day — edits save normally</b>') + '</div>' +
      '<button type="button" class="date-nav-btn" data-nav-day="1"' + (dKey >= todayKey() ? ' disabled' : '') + ' title="Next day">&rarr;</button>' +
      '</div>';
    if (!isToday){
      html += '<div style="text-align:center; margin:-4px 0 18px;"><button type="button" class="jump-today" data-jump-today>Jump back to today</button></div>';
    } else {
      html += '<div style="margin-bottom:18px;"></div>';
    }

    html += '<div class="card">';
    if (!mainList.length && !weeklyList.length && !monthlyList.length){
      html += '<div class="empty">No goals yet for ' + esc(person.name) + '. Add one below.</div>';
    } else {
      if (mainList.length){
        html += '<div class="drag-list" data-drag-group="' + personKey + '|main">';
        mainList.forEach(function(h){
          html += renderTile(h, personKey, dKey, 'daily');
        });
        html += '</div>';
      }
      if (weeklyList.length){
        html += '<div class="pane-subhead">This week</div>';
        html += '<div class="drag-list" data-drag-group="' + personKey + '|weekly">';
        weeklyList.forEach(function(h){
          html += renderTile(h, personKey, wKey, 'weekly');
        });
        html += '</div>';
      }
      if (monthlyList.length){
        html += '<div class="pane-subhead">This month</div>';
        html += '<div class="drag-list" data-drag-group="' + personKey + '|monthly">';
        monthlyList.forEach(function(h){
          html += renderTile(h, personKey, mKey, 'monthly');
        });
        html += '</div>';
      }
    }
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="section-title">Add a goal</div>';
    html += '<div class="add-form">';
    html += '<div class="add-field">' +
      '<input type="text" id="new-habit" maxlength="60" placeholder="Add a goal, e.g. 20-minute walk" value="' + esc(pendingNewHabitVal) + '" />' +
      '</div>';
    html += '<button type="button" id="add-habit-btn" class="add-submit">Continue</button>';
    html += '</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="section-title">Browse previous days</div>';
    html += '<div class="legend"><span class="legend-swatch" style="background:var(--surface-2); border:1px solid var(--border);"></span>none' +
      '<span class="legend-swatch" style="background:var(--done-soft); border:1px solid var(--done);"></span>partial' +
      '<span class="legend-swatch" style="background:var(--done); border:1px solid var(--done);"></span>all done</div>';
    html += '<div class="history">';
    for (var i = 13; i >= 0; i--){
      var k = addDaysToKey(todayKey(), -i);
      var comp = dayCompletionForPerson(STATE, k, personKey);
      var bg = 'var(--surface-2)', bd = 'var(--border)';
      if (comp.engaged){
        if (comp.ratio >= 0.999){ bg = 'var(--done)'; bd = 'var(--done)'; }
        else if (comp.ratio > 0){ bg = 'var(--done-soft)'; bd = 'var(--done)'; }
      }
      var cls = 'day-cell' + (k===todayKey() ? ' today' : '') + (k===dKey ? ' viewing' : '');
      html += '<button type="button" class="' + cls + '" style="background:' + bg + '; border-color:' + bd + ';" data-jump-day="' + k + '" title="' + esc(fullDate(k)) + '">' +
        '<span class="dow">' + esc(dowLabel(k)) + '</span><span class="num">' + esc(dayNum(k)) + '</span></button>';
    }
    html += '</div></div>';

    html += '<footer><span class="status-dot" id="status-dot"></span><span id="status-label">Ready</span>' +
      '<span style="flex:1"></span>' +
      (personHasNoGoals(STATE, personKey) ? '' : '<button type="button" class="settings-link" data-save-as-template>Save as template</button>') +
      '<button type="button" class="settings-link" data-open-tracker-wizard>Set up tracker</button>' +
      '<button type="button" class="settings-link" data-go-trackers>My trackers</button>' +
      '<button type="button" class="settings-link" id="settings-link">Settings</button></footer>';

    if (confirmRemoveId){
      var pendingHabit = STATE.habits.find(function(h){ return h.id === confirmRemoveId; });
      if (pendingHabit){
        html += '<div class="confirm-overlay" data-confirm-overlay>' +
          '<div class="confirm-box">' +
          '<p class="confirm-text">Remove <b>' + esc(pendingHabit.name) + '</b> from the tracker?</p>' +
          '<div class="confirm-actions">' +
          '<button type="button" class="confirm-cancel" data-confirm-cancel>Cancel</button>' +
          '<button type="button" class="confirm-remove" data-confirm-remove>Remove</button>' +
          '</div></div></div>';
      } else {
        confirmRemoveId = null;
      }
    }

    if (wizard) html += renderWizard(p1, p2);
    if (trackerWizard) html += renderTrackerWizard();
    if (templateSaveModal) html += renderSaveTemplateModal();

    app.innerHTML = html;
    setStatus(status);
    wireEvents();
  }

  var CADENCE_OPTIONS = [
    ['daily', 'Daily'],
    ['weekday', 'Weekdays'],
    ['weekend', 'Weekends'],
    ['weekly', 'Weekly'],
    ['monthly', 'Monthly']
  ];

  function renderWizard(p1, p2){
    var html = '<div class="wizard-overlay" data-wizard-overlay>';
    html += '<div class="wizard-box">';
    html += '<button type="button" class="wizard-close" data-wizard-close title="Cancel">✕</button>';
    html += '<div class="wizard-progress">Step ' + wizard.step + ' of 3</div>';
    html += '<p class="wizard-goal-name">“' + esc(wizard.name) + '”</p>';

    if (wizard.step === 1){
      html += '<h3 class="wizard-q">Who’s this for?</h3>';
      html += '<div class="wizard-options wizard-options-3">' +
        '<button type="button" class="wizard-opt" data-wizard-assignee="' + p1.key + '">' + esc(p1.name) + '</button>' +
        '<button type="button" class="wizard-opt" data-wizard-assignee="' + p2.key + '">' + esc(p2.name) + '</button>' +
        '<button type="button" class="wizard-opt" data-wizard-assignee="both">Both</button>' +
        '</div>';
    } else if (wizard.step === 2){
      html += '<button type="button" class="wizard-back" data-wizard-back>&larr; Back</button>';
      html += '<h3 class="wizard-q">How often?</h3>';
      html += '<div class="wizard-options wizard-options-list">';
      CADENCE_OPTIONS.forEach(function(pair){
        html += '<button type="button" class="wizard-opt" data-wizard-cadence="' + pair[0] + '">' + pair[1] + '</button>';
      });
      html += '</div>';
      html += '<div class="wizard-hint">"Weekdays"/"Weekends" only show up on the days they apply to — handy for something like a different wake-up or bedtime target.</div>';
    } else if (wizard.step === 3){
      html += '<button type="button" class="wizard-back" data-wizard-back>&larr; Back</button>';
      html += '<h3 class="wizard-q">How many points is it worth?</h3>';
      html += '<div class="wizard-points">' +
        '<button type="button" class="wizard-step-btn" data-wizard-points="-1"' + (wizard.points<=1?' disabled':'') + ' title="Fewer points">&minus;</button>' +
        '<span class="wizard-points-val">' + wizard.points + '</span>' +
        '<button type="button" class="wizard-step-btn" data-wizard-points="1"' + (wizard.points>=3?' disabled':'') + ' title="More points">+</button>' +
        '</div>';
      html += '<button type="button" class="wizard-submit" data-wizard-submit>Add goal</button>';
    }

    html += '</div></div>';
    return html;
  }

  function renderTrackerWizard(){
    var tw = trackerWizard;
    var p1 = STATE.people[0], p2 = STATE.people[1];
    var html = '<div class="wizard-overlay" data-tracker-wizard-overlay>';
    html += '<div class="wizard-box">';
    html += '<button type="button" class="wizard-close" data-tracker-wizard-close title="Cancel">✕</button>';

      html += '<button type="button" class="wizard-back" data-tracker-wizard-back>&larr; Back</button>';

    if (tw.screen === 'who'){
      html += '<h3 class="wizard-q">Who is this tracker for?</h3>';
      html += '<div class="wizard-options wizard-options-3">' +
        '<button type="button" class="wizard-opt" data-tracker-scope="' + p1.key + '">' + esc(p1.name) + '</button>' +
        '<button type="button" class="wizard-opt" data-tracker-scope="' + p2.key + '">' + esc(p2.name) + '</button>' +

    } else if (tw.screen === 'kind'){
      var hasSaved = STATE.trackerLibrary.some(function(t){ return t.scope === tw.scope; });
      var hasTemplates = STATE.templates.length > 0;
      html += '<h3 class="wizard-q">What would you like to set up?</h3>';
      html += '<div class="wizard-options wizard-options-list">' +
        '<button type="button" class="wizard-opt" data-tracker-kind="hard75">🏆 75 Hard</button>' +
        (hasTemplates ? '<button type="button" class="wizard-opt" data-tracker-kind="chooseTemplate">📋 Choose a template</button>' : '') +
        '<button type="button" class="wizard-opt" data-tracker-kind="custom">✏️ Build your own</button>' +
        (hasSaved ? '<button type="button" class="wizard-opt" data-tracker-kind="load">📂 Load a saved tracker</button>' : '') +
        '</div>';
    } else if (tw.screen === 'templatePick'){
      var cats = ['All'].concat(uniqueTemplateCategories());
      html += '<h3 class="wizard-q">Choose a template</h3>';
      html += '<div class="category-chips">';
      cats.forEach(function(c){
        html += '<button type="button" class="category-chip' + (tw.categoryFilter === c ? ' active' : '') + '" data-tracker-category-filter="' + esc(c) + '">' + esc(c) + '</button>';
      });
      html += '</div>';
      var tplMatches = STATE.templates.filter(function(t){ return tw.categoryFilter === 'All' || t.category === tw.categoryFilter; });
      html += '<div class="wizard-options wizard-options-list">';
      if (!tplMatches.length){
        html += '<div class="wizard-hint">No templates in this category yet.</div>';
      }
      tplMatches.forEach(function(t){
        html += '<button type="button" class="wizard-opt" data-tracker-pick-template="' + t.id + '">' + esc(t.name) +
          ' <span style="color:var(--text-muted); font-weight:400;">(' + esc(t.category) + ' · ' + t.items.length + ' goal' + (t.items.length===1?'':'s') + (t.isPublic ? ' · 🌐 Public' : '') + ')</span></button>';
      });
      html += '</div>';
    } else if (tw.screen === 'loadPick'){
      var matches = STATE.trackerLibrary.filter(function(t){ return t.scope === tw.scope; });
      html += '<h3 class="wizard-q">Which saved tracker?</h3>';
      html += '<div class="wizard-options wizard-options-list">';
      matches.forEach(function(t){
        html += '<button type="button" class="wizard-opt" data-tracker-pick-library="' + t.id + '">' + esc(t.name) +
          ' <span style="color:var(--text-muted); font-weight:400;">(' + t.habitIds.length + ' goal' + (t.habitIds.length===1?'':'s') + ')</span></button>';
      });
      html += '</div>';
    } else if (tw.screen === 'saveName'){
      html += '<h3 class="wizard-q">Save your current goals first</h3>';
      html += '<p class="wizard-hint" style="margin-bottom:12px;">Give this setup a name so you can switch back to it later.</p>';
      html += '<input type="text" class="wizard-input" id="tracker-save-name" maxlength="40" value="' + esc(tw.saveName) + '" placeholder="e.g. My usual goals">';
      html += '<button type="button" class="wizard-submit" data-tracker-continue-savename>Save &amp; continue</button>';
    } else if (tw.screen === 'confirm'){
      var scopeLabel = tw.scope === 'both' ? 'both of you' : ((personByKey(STATE, tw.scope) || {}).name || tw.scope);
      var summary = '';
      if (tw.kind === 'hard75') summary = 'This sets up the <b>75 Hard</b> template for ' + esc(scopeLabel) + '.';
      else if (tw.kind === 'customTemplate'){
        var pickedTpl = STATE.templates.find(function(t){ return t.id === tw.templateId; });
        summary = 'This sets up the <b>' + esc(pickedTpl ? pickedTpl.name : 'template') + '</b> template for ' + esc(scopeLabel) + '.';
      }
      else if (tw.kind === 'custom') summary = 'This clears the slate for ' + esc(scopeLabel) + ' so you can build your own goals from scratch.';
      else if (tw.kind === 'load'){
        var entry = STATE.trackerLibrary.find(function(t){ return t.id === tw.libraryEntryId; });
        summary = 'This loads <b>' + esc(entry ? entry.name : 'the saved tracker') + '</b> for ' + esc(scopeLabel) + '.';
      }
      if (habitsForScope(STATE, tw.scope).length){
        summary += ' Your current goals will be saved as “' + esc(tw.saveName || 'My goals') + '” so you can switch back anytime.';
      }
      html += '<h3 class="wizard-q">Ready to apply?</h3>';
      html += '<p class="wizard-summary">' + summary + '</p>';
      html += '<button type="button" class="wizard-submit" data-tracker-submit>Confirm &amp; apply</button>';
    }

    html += '</div></div>';
    return html;
  }

      } else {

  function renderTile(h, personKey, bucketKey, mode){
    var c = getCell(STATE, bucketKey, h.id, personKey);
    var noteKey = h.id + ':' + personKey;
    var label = cadenceLabel(h);
    var nameHtml = esc(displayName(h, bucketKey)) + (label ? ' <span style="color:var(--text-muted); font-weight:400; font-size:11px;">(' + label + ')</span>' : '');
    var html = '<div class="task" data-drag-id="' + h.id + '">';
    html += '<div class="task-row">' +
      '<span class="drag-handle" data-drag-handle title="Drag to reorder">⠿</span>' +
      '<div class="task-name" data-longpress="' + h.id + '">' + nameHtml + '</div>';
    if (mode === 'weekly'){
      html += '<button type="button" class="pill pm weekly' + (c.done ? ' on' : '') + '" data-toggle-weekly="' + h.id + ':' + personKey + ':' + bucketKey + '">' +
        (c.done ? '✓ done' : 'not yet') + '</button>';
    } else if (mode === 'monthly'){
      html += '<button type="button" class="pill pm weekly' + (c.done ? ' on' : '') + '" data-toggle-monthly="' + h.id + ':' + personKey + ':' + bucketKey + '">' +
        (c.done ? '✓ done' : 'not yet') + '</button>';
    } else {
      html += '<div class="cell-group">' +
        '<button type="button" class="pill miss' + (c.missed ? ' on' : '') + '" data-toggle="' + h.id + ':' + personKey + ':missed:' + bucketKey + '" title="Missed">✕</button>' +
        '<button type="button" class="pill pm' + (c.done ? ' on' : '') + '" data-toggle="' + h.id + ':' + personKey + ':done:' + bucketKey + '" title="Got it done">✓</button>' +
        '</div>';
    }
    html += '<button type="button" class="note-toggle' + (c.note ? ' has-note' : '') + '" data-note-toggle="' + noteKey + '" title="Notes">💬</button>' +
      '</div>';
    var noteWhen = mode === 'weekly' ? 'this week' : mode === 'monthly' ? 'this month' : (bucketKey===todayKey() ? 'today' : shortDate(bucketKey));
    html += '<div class="note-panel" data-note-panel="' + noteKey + '"' + (expandedNotes[noteKey] ? '' : ' hidden') + '>' +
      '<button type="button" class="note-banner" data-note-toggle="' + noteKey + '">Note for ' + noteWhen + ' <span class="chev">▲</span></button>' +
      '<textarea data-note-input="' + h.id + ':' + personKey + ':' + bucketKey + '" placeholder="Add a note...">' + esc(c.note || '') + '</textarea>' +
      '</div>';
    html += '</div>';
    return html;
  }

  function render(){
    var app = document.getElementById('app');
    if (!app || !STATE) return;
    if (VIEW.screen === 'person' && VIEW.personKey) renderPersonPage(VIEW.personKey);
    else if (VIEW.screen === 'trackers') renderTrackersPage();
    else renderHome();
  }

  // ==========================================================================
  // Event wiring
  // ==========================================================================
  var sortableInstances = [];

  function wireEvents(){
    var app = document.getElementById('app');

    sortableInstances.forEach(function(s){ try{ s.destroy(); }catch(e){} });
    sortableInstances = [];

    var goHomeBtn = document.querySelector('[data-go-home]');
    if (goHomeBtn) goHomeBtn.addEventListener('click', goHome);

    app.querySelectorAll('[data-enter-person]').forEach(function(btn){
      btn.addEventListener('click', function(){ enterPerson(btn.getAttribute('data-enter-person')); });
    });

    app.querySelectorAll('[data-nav-day]').forEach(function(btn){
      btn.addEventListener('click', function(){ navigateDay(parseInt(btn.getAttribute('data-nav-day'), 10)); });
    });
    var jumpTodayBtn = document.querySelector('[data-jump-today]');
    if (jumpTodayBtn) jumpTodayBtn.addEventListener('click', function(){ jumpToDay(todayKey()); });
    app.querySelectorAll('[data-jump-day]').forEach(function(btn){
      btn.addEventListener('click', function(){ jumpToDay(btn.getAttribute('data-jump-day')); });
    });

    app.querySelectorAll('[data-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-toggle').split(':');
        toggle(parts[0], parts[1], parts[2], parts[3]);
      });
    });
    app.querySelectorAll('[data-toggle-weekly]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-toggle-weekly').split(':');
        toggleWeekly(parts[0], parts[1], parts[2]);
      });
    });
    app.querySelectorAll('[data-toggle-monthly]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-toggle-monthly').split(':');
        toggleMonthly(parts[0], parts[1], parts[2]);
      });
    });

    var LONG_PRESS_MS = 600;
    var MOVE_TOLERANCE = 10;
    app.querySelectorAll('[data-longpress]').forEach(function(el){
      var timer = null;
      var startX = 0, startY = 0;
      function clear(){ clearTimeout(timer); timer = null; el.classList.remove('pressing'); }
      function start(e){
        if (typeof e.button === 'number' && e.button !== 0) return;
        startX = typeof e.clientX === 'number' ? e.clientX : 0;
        startY = typeof e.clientY === 'number' ? e.clientY : 0;
        el.classList.add('pressing');
        timer = setTimeout(function(){
          el.classList.remove('pressing');
          requestRemove(el.getAttribute('data-longpress'));
        }, LONG_PRESS_MS);
      }
      function move(e){
        if (!timer) return;
        var x = typeof e.clientX === 'number' ? e.clientX : startX;
        var y = typeof e.clientY === 'number' ? e.clientY : startY;
        if (Math.abs(x - startX) > MOVE_TOLERANCE || Math.abs(y - startY) > MOVE_TOLERANCE) clear();
      }
      el.addEventListener('pointerdown', start);
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', clear);
      el.addEventListener('pointercancel', clear);
      el.addEventListener('pointerleave', clear);
      el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    });
    var overlay = app.querySelector('[data-confirm-overlay]');
    if (overlay) overlay.addEventListener('click', function(e){ if (e.target === overlay) cancelRemove(); });
    var confirmCancelBtn = app.querySelector('[data-confirm-cancel]');
    if (confirmCancelBtn) confirmCancelBtn.addEventListener('click', cancelRemove);
    var confirmRemoveBtn = app.querySelector('[data-confirm-remove]');
    if (confirmRemoveBtn) confirmRemoveBtn.addEventListener('click', confirmRemove);

    app.querySelectorAll('[data-rename]').forEach(function(input){
      input.addEventListener('change', function(){ renamePerson(input.getAttribute('data-rename'), input.value); });
      input.addEventListener('keydown', function(e){ if (e.key==='Enter') input.blur(); });
    });

    var addBtn = document.getElementById('add-habit-btn');
    var newHabitInput = document.getElementById('new-habit');
    function startWizard(){
      var name = newHabitInput.value.trim();
      if (!name) return;
      openWizard(name);
    }
    if (addBtn && newHabitInput){
      addBtn.addEventListener('click', startWizard);
      newHabitInput.addEventListener('keydown', function(e){
        if (e.key==='Enter') startWizard();
      });
    }

    // Add-a-goal wizard
    var wizardOverlay = app.querySelector('[data-wizard-overlay]');
    if (wizardOverlay) wizardOverlay.addEventListener('click', function(e){ if (e.target === wizardOverlay) closeWizard(); });
    var wizardCloseBtn = app.querySelector('[data-wizard-close]');
    if (wizardCloseBtn) wizardCloseBtn.addEventListener('click', closeWizard);
    var wizardBackBtn = app.querySelector('[data-wizard-back]');
    if (wizardBackBtn) wizardBackBtn.addEventListener('click', wizardBack);
    app.querySelectorAll('[data-wizard-assignee]').forEach(function(btn){
      btn.addEventListener('click', function(){ wizardChooseAssignee(btn.getAttribute('data-wizard-assignee')); });
    });
    app.querySelectorAll('[data-wizard-cadence]').forEach(function(btn){
      btn.addEventListener('click', function(){ wizardChooseCadence(btn.getAttribute('data-wizard-cadence')); });
    });
    app.querySelectorAll('[data-wizard-points]').forEach(function(btn){
      btn.addEventListener('click', function(){ wizardAdjustPoints(parseInt(btn.getAttribute('data-wizard-points'), 10)); });
    });
    var wizardSubmitBtn = app.querySelector('[data-wizard-submit]');
    if (wizardSubmitBtn) wizardSubmitBtn.addEventListener('click', wizardSubmit);

    // Tracker (account) setup wizard triggers + controls
    app.querySelectorAll('[data-open-tracker-wizard]').forEach(function(btn){
      btn.addEventListener('click', openTrackerWizard);
    });
    var goTrackersBtn = app.querySelector('[data-go-trackers]');
    if (goTrackersBtn) goTrackersBtn.addEventListener('click', goTrackers);

    var twOverlay = app.querySelector('[data-tracker-wizard-overlay]');
    if (twOverlay) twOverlay.addEventListener('click', function(e){ if (e.target === twOverlay) closeTrackerWizard(); });
    var twCloseBtn = app.querySelector('[data-tracker-wizard-close]');
    if (twCloseBtn) twCloseBtn.addEventListener('click', closeTrackerWizard);
    var twBackBtn = app.querySelector('[data-tracker-wizard-back]');
    if (twBackBtn) twBackBtn.addEventListener('click', trackerWizardBack);
    app.querySelectorAll('[data-tracker-scope]').forEach(function(btn){
      btn.addEventListener('click', function(){ trackerWizardChooseScope(btn.getAttribute('data-tracker-scope')); });
    });
    app.querySelectorAll('[data-tracker-kind]').forEach(function(btn){
      btn.addEventListener('click', function(){ trackerWizardChooseKind(btn.getAttribute('data-tracker-kind')); });
    });
    app.querySelectorAll('[data-tracker-pick-library]').forEach(function(btn){
      btn.addEventListener('click', function(){ trackerWizardPickLibrary(btn.getAttribute('data-tracker-pick-library')); });
    });
    app.querySelectorAll('[data-tracker-category-filter]').forEach(function(btn){
      btn.addEventListener('click', function(){ trackerWizardSetCategoryFilter(btn.getAttribute('data-tracker-category-filter')); });
    });
    app.querySelectorAll('[data-tracker-pick-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ trackerWizardPickTemplate(btn.getAttribute('data-tracker-pick-template')); });
    });
    var twSaveNameInput = document.getElementById('tracker-save-name');
    var twContinueBtn = app.querySelector('[data-tracker-continue-savename]');
    if (twContinueBtn && twSaveNameInput){
      twContinueBtn.addEventListener('click', function(){
        trackerWizardSetSaveName(twSaveNameInput.value);
        trackerWizardContinueFromSaveName();
      });
      twSaveNameInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') twContinueBtn.click(); });
    }
    var twSubmitBtn = app.querySelector('[data-tracker-submit]');
    if (twSubmitBtn) twSubmitBtn.addEventListener('click', trackerWizardSubmit);

    // My Trackers screen: load / rename / delete a saved tracker
    app.querySelectorAll('[data-load-tracker]').forEach(function(btn){
      btn.addEventListener('click', function(){ startLoadFromLibrary(btn.getAttribute('data-load-tracker')); });
    });
    app.querySelectorAll('[data-rename-tracker]').forEach(function(btn){
      btn.addEventListener('click', function(){ renamingTrackerId = btn.getAttribute('data-rename-tracker'); render(); });
    });
    app.querySelectorAll('[data-tracker-rename-input]').forEach(function(input){
      function commitRename(){ renameTracker(input.getAttribute('data-tracker-rename-input'), input.value); renamingTrackerId = null; }
      input.addEventListener('blur', commitRename);
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') input.blur(); });
    });
    app.querySelectorAll('[data-delete-tracker]').forEach(function(btn){
      btn.addEventListener('click', function(){ requestDeleteTracker(btn.getAttribute('data-delete-tracker')); });
    });
    var tdOverlay = app.querySelector('[data-tracker-delete-overlay]');
    if (tdOverlay) tdOverlay.addEventListener('click', function(e){ if (e.target === tdOverlay) cancelDeleteTracker(); });
    var tdCancelBtn = app.querySelector('[data-tracker-delete-cancel]');
    if (tdCancelBtn) tdCancelBtn.addEventListener('click', cancelDeleteTracker);
    var tdConfirmBtn = app.querySelector('[data-tracker-delete-confirm]');
    if (tdConfirmBtn) tdConfirmBtn.addEventListener('click', confirmDeleteTracker);

    // Save-as-template trigger + modal
    var saveTemplateBtn = app.querySelector('[data-save-as-template]');
    if (saveTemplateBtn) saveTemplateBtn.addEventListener('click', function(){ openSaveTemplateModal(VIEW.personKey); });
    var tmOverlay = app.querySelector('[data-template-modal-overlay]');
    if (tmOverlay) tmOverlay.addEventListener('click', function(e){ if (e.target === tmOverlay) closeSaveTemplateModal(); });
    var tmCloseBtn = app.querySelector('[data-template-modal-close]');
    if (tmCloseBtn) tmCloseBtn.addEventListener('click', closeSaveTemplateModal);
    var tmNameInput = document.getElementById('template-name-input');
    if (tmNameInput) tmNameInput.addEventListener('input', function(){ saveTemplateModalSetName(tmNameInput.value); });
    var tmCategoryInput = document.getElementById('template-category-input');
    if (tmCategoryInput) tmCategoryInput.addEventListener('input', function(){ saveTemplateModalSetCategory(tmCategoryInput.value); });
    app.querySelectorAll('[data-template-category-chip]').forEach(function(btn){
      btn.addEventListener('click', function(){ saveTemplateModalSetCategory(btn.getAttribute('data-template-category-chip')); render(); });
    });
    var tmPublicToggle = app.querySelector('[data-template-toggle-public]');
    if (tmPublicToggle) tmPublicToggle.addEventListener('click', saveTemplateModalTogglePublic);
    var tmSaveBtn = app.querySelector('[data-template-save-submit]');
    if (tmSaveBtn) tmSaveBtn.addEventListener('click', submitSaveTemplateModal);

    // My Trackers screen: apply / rename / recategorize / publicize / delete a template
    app.querySelectorAll('[data-apply-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ startApplyTemplate(btn.getAttribute('data-apply-template')); });
    });
    app.querySelectorAll('[data-rename-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ renamingTemplateId = btn.getAttribute('data-rename-template'); render(); });
    });
    app.querySelectorAll('[data-template-rename-input]').forEach(function(input){
      function commitTemplateRename(){ renameTemplate(input.getAttribute('data-template-rename-input'), input.value); renamingTemplateId = null; }
      input.addEventListener('blur', commitTemplateRename);
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') input.blur(); });
    });
    app.querySelectorAll('[data-recategorize-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ editingTemplateCategoryId = btn.getAttribute('data-recategorize-template'); render(); });
    });
    app.querySelectorAll('[data-template-category-input-inline]').forEach(function(input){
      function commitTemplateCategory(){ recategorizeTemplate(input.getAttribute('data-template-category-input-inline'), input.value); editingTemplateCategoryId = null; }
      input.addEventListener('blur', commitTemplateCategory);
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') input.blur(); });
    });
    app.querySelectorAll('[data-toggle-template-public]').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleTemplatePublic(btn.getAttribute('data-toggle-template-public')); });
    });
    app.querySelectorAll('[data-delete-template]').forEach(function(btn){
      btn.addEventListener('click', function(){ requestDeleteTemplate(btn.getAttribute('data-delete-template')); });
    });
    var tmpDeleteOverlay = app.querySelector('[data-template-delete-overlay]');
    if (tmpDeleteOverlay) tmpDeleteOverlay.addEventListener('click', function(e){ if (e.target === tmpDeleteOverlay) cancelDeleteTemplate(); });
    var tmpDeleteCancelBtn = app.querySelector('[data-template-delete-cancel]');
    if (tmpDeleteCancelBtn) tmpDeleteCancelBtn.addEventListener('click', cancelDeleteTemplate);
    var tmpDeleteConfirmBtn = app.querySelector('[data-template-delete-confirm]');
    if (tmpDeleteConfirmBtn) tmpDeleteConfirmBtn.addEventListener('click', confirmDeleteTemplate);

    app.querySelectorAll('[data-note-toggle]').forEach(function(btn){
      btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-note-toggle');
        var willOpen = !expandedNotes[key];
        if (!willOpen){
          var panel = app.querySelector('[data-note-panel="' + key + '"]');
          var ta = panel ? panel.querySelector('textarea') : null;
          if (ta){
            var parts = ta.getAttribute('data-note-input').split(':');
            setNote(parts[2], parts[0], parts[1], ta.value);
          }
        }
        expandedNotes[key] = willOpen;
        render();
      });
    });
    app.querySelectorAll('[data-note-input]').forEach(function(ta){
      ta.addEventListener('blur', function(){
        var parts = ta.getAttribute('data-note-input').split(':');
        setNote(parts[2], parts[0], parts[1], ta.value);
        var key = parts[0] + ':' + parts[1];
        expandedNotes[key] = false;
        render();
      });
    });

    var settingsLink = document.getElementById('settings-link');
    if (settingsLink){
      settingsLink.addEventListener('click', function(){
        if (confirm('Disconnect this device from the shared tracker? You can reconnect any time with the same Bin ID and key.')){
          clearConfigLocal();
          clearTimeout(saveTimer);
          stopPolling();
          CONFIG = null;
          STATE = null;
          renderSetup();
        }
      });
    }

    // Drag-to-reorder goal tiles (SortableJS — handles touch + mouse cleanly).
    if (typeof Sortable !== 'undefined'){
      app.querySelectorAll('[data-drag-group]').forEach(function(container){
        var parts = container.getAttribute('data-drag-group').split('|');
        var personKey = parts[0], group = parts[1];
        var inst = Sortable.create(container, {
          handle: '.drag-handle',
          animation: 150,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          dragClass: 'sortable-drag',
          onEnd: function(){
            var ids = Array.prototype.slice.call(container.children).map(function(el){ return el.getAttribute('data-drag-id'); });
            reorderGroup(personKey, group, ids);
          }
        });
        sortableInstances.push(inst);
      });
    }
  }

  // ==========================================================================
  // First-run / settings screen
  // ==========================================================================
  function renderSetup(prefill, errorMsg){
    prefill = prefill || {};
    var app = document.getElementById('app');
    var html = '<div class="setup-wrap"><div class="setup-card">' +
      '<h1>Connect Say &amp; Do</h1>' +
      '<p>This device needs to be pointed at your shared data store once. Paste the Bin ID and key you (or your partner) got from jsonbin.io — the same two values for both of you.</p>' +
      '<div class="setup-field"><label for="setup-bin">Bin ID</label>' +
      '<input type="text" id="setup-bin" placeholder="e.g. 66f1a2b3c4d5e6f7a8b9c0d1" value="' + esc(prefill.binId || '') + '" autocomplete="off" spellcheck="false"></div>' +
      '<div class="setup-field"><label for="setup-key">Master key (or access key)</label>' +
      '<input type="text" id="setup-key" placeholder="e.g. $2a$10$..." value="' + esc(prefill.apiKey || '') + '" autocomplete="off" spellcheck="false"></div>' +
      '<div class="setup-actions"><button type="button" id="setup-connect">Connect</button><span id="setup-status" style="font-size:12px;color:var(--text-muted)"></span></div>' +
      (errorMsg ? '<div class="setup-error">' + esc(errorMsg) + '</div>' : '') +
      '</div></div>';
    app.innerHTML = html;
    document.getElementById('setup-connect').addEventListener('click', async function(){
      var binId = document.getElementById('setup-bin').value.trim();
      var apiKey = document.getElementById('setup-key').value.trim();
      if (!binId || !apiKey){ renderSetup({binId:binId, apiKey:apiKey}, 'Please fill in both fields.'); return; }
      var btn = document.getElementById('setup-connect');
      var statusEl = document.getElementById('setup-status');
      btn.disabled = true;
      statusEl.textContent = 'Connecting…';
      CONFIG = {binId: binId, apiKey: apiKey};
      try{
        var data = await fetchRemote();
        var fresh = normalizeState(data.record || data);
        saveConfigLocal(CONFIG);
        STATE = fresh;
        saveCache(STATE);
        startApp();
      }catch(e){
        CONFIG = null;
        renderSetup({binId:binId, apiKey:apiKey}, 'Could not connect — double check the Bin ID and key, and that the bin is reachable.');
      }
    });
  }

  function injectHead(){
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap';
    document.head.appendChild(link);
    var style = document.createElement('style');
    style.textContent = CSS_TEXT;
    document.head.appendChild(style);
  }

  function startApp(){
    var cached = loadCache();
    if (cached && !STATE){ STATE = normalizeState(cached); applyPendingOps(STATE); }
    VIEW = { screen: 'home', personKey: null, dateKey: todayKey() };
    if (STATE) render();
    refreshFromRemote(true);
    // Poll every few minutes while the tab is visible, and stop entirely
    // while it's hidden — no point burning requests on a backgrounded tab.
    startPolling();
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'visible'){
        refreshFromRemote(false);
        startPolling();
      } else {
        stopPolling();
      }
    });
    // Belt-and-suspenders for mobile: some mobile browsers/PWA wrappers are
    // unreliable about firing visibilitychange when a backgrounded tab is
    // brought back, which would otherwise leave this device polling-dead
    // and stuck showing whatever it last had — exactly like "not getting
    // their updates." 'focus' and 'pageshow' (the latter also covers
    // back-forward-cache restores) catch the cases visibilitychange misses.
    window.addEventListener('focus', function(){
      refreshFromRemote(false);
      startPolling();
    });
    window.addEventListener('pageshow', function(){
      refreshFromRemote(false);
      startPolling();
    });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      if (confirmRemoveId) cancelRemove();
      else if (confirmDeleteTrackerId) cancelDeleteTracker();
      else if (confirmDeleteTemplateId) cancelDeleteTemplate();
      else if (wizard) closeWizard();
      else if (trackerWizard) closeTrackerWizard();
      else if (templateSaveModal) closeSaveTemplateModal();
    });
  }

  function boot(){
    injectHead();
    CONFIG = loadConfig();
    if (!CONFIG){ renderSetup(); return; }
    startApp();
  }

  boot();
})();
</script>
